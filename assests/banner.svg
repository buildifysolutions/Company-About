<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.6" stop-color="#140700"/>
      <stop offset="1" stop-color="#2a1000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B00" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF6B00" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="600" cy="170" rx="420" ry="130" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 10">
    <path d="M0 290 H260 L300 250 H520">
      <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 290 H940 L900 250 H680">
      <animate attributeName="stroke-dashoffset" from="0" to="240" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M0 50 H180 L220 90 H400">
      <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 50 H1020 L980 90 H800">
      <animate attributeName="stroke-dashoffset" from="0" to="240" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#FF6B00">
    <circle cx="520" cy="250" r="5"><animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="250" r="5"><animate attributeName="r" values="4;9;4" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="90" r="5"><animate attributeName="r" values="4;9;4" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="90" r="5"><animate attributeName="r" values="4;9;4" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="168" text-anchor="middle" font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="96" font-weight="900" fill="#FFFFFF">BUILD<tspan fill="#FF6B00">IFY</tspan>
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <g>
    <rect x="360" y="195" width="120" height="3" fill="#FF6B00"/>
    <rect x="720" y="195" width="120" height="3" fill="#FF6B00"/>
    <text x="600" y="206" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="14" fill="#FFFFFF">SOLUTIONS</text>
  </g>
  <text x="600" y="268" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="12" fill="#FF6B00">WE BUILD. YOU GROW.
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
