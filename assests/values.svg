<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b00"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Arial,sans-serif;font-weight:900;font-size:27px;fill:#fff}
    .d{font-family:'Segoe UI',Arial,sans-serif;font-size:16px;fill:#BBBBBB}
    .n{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:4px;fill:#FF6B00}
  </style>

  <g>
    <rect x="20" y="20" width="370" height="280" rx="22" fill="url(#card)" stroke="#FF6B00" stroke-width="2" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="205" cy="95" r="42" fill="#FF6B00" opacity="0.15">
      <animate attributeName="r" values="36;50;36" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(205 95)" fill="#FF6B00">
      <path d="M0 22 C-40 -8 -28 -38 -10 -34 C-4 -33 0 -27 0 -24 C0 -27 4 -33 10 -34 C28 -38 40 -8 0 22 Z">
        <animateTransform attributeName="transform" type="scale" values="1;1.14;1" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="205" y="172" text-anchor="middle" class="n">01</text>
    <text x="205" y="208" text-anchor="middle" class="t">HEART HUMAN</text>
    <text x="205" y="244" text-anchor="middle" class="d">Real people behind every product,</text>
    <text x="205" y="266" text-anchor="middle" class="d">every message and every project.</text>
  </g>

  <g>
    <rect x="415" y="20" width="370" height="280" rx="22" fill="url(#card)" stroke="#FF6B00" stroke-width="2" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="600" cy="95" r="42" fill="#FF6B00" opacity="0.15">
      <animate attributeName="r" values="36;50;36" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(600 95)" fill="#FF6B00">
      <polygon points="0,-34 10,-11 34,-10 16,6 21,31 0,18 -21,31 -16,6 -34,-10 -10,-11">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <text x="600" y="172" text-anchor="middle" class="n">02</text>
    <text x="600" y="208" text-anchor="middle" class="t">STANDARDS HIGH</text>
    <text x="600" y="244" text-anchor="middle" class="d">Quality components, reliable work,</text>
    <text x="600" y="266" text-anchor="middle" class="d">and support you can count on.</text>
  </g>

  <g>
    <rect x="810" y="20" width="370" height="280" rx="22" fill="url(#card)" stroke="#FF6B00" stroke-width="2" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="995" cy="95" r="42" fill="#FF6B00" opacity="0.15">
      <animate attributeName="r" values="36;50;36" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(995 95)">
      <path d="M0 -36 L32 -22 V4 C32 22 14 32 0 40 C-14 32 -32 22 -32 4 V-22 Z" fill="#FF6B00"/>
      <path d="M-14 2 L-4 13 L15 -10" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50" stroke-dashoffset="50">
        <animate attributeName="stroke-dashoffset" values="50;0;0;50" keyTimes="0;0.35;0.8;1" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="995" y="172" text-anchor="middle" class="n">03</text>
    <text x="995" y="208" text-anchor="middle" class="t">BOUNDARIES CLEAR</text>
    <text x="995" y="244" text-anchor="middle" class="d">Honest scope, honest timelines,</text>
    <text x="995" y="266" text-anchor="middle" class="d">and respect on both sides.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
